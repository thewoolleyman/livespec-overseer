# adopter-release-dispatch.yml — fan out this repo's releases to ADOPTERS.
#
# Why this exists beside release-dispatch.yml: the fleet's reusable release
# fan-out builds its dispatch matrix from the fleet manifest's `fleet` array
# only — `[(.fleet // .members)[].repo | select(...)]` — so the manifest's
# `adopters` array is never dispatched to. An adopter that pins a CONCRETE
# release tag therefore never learns a release happened, and its pin goes stale
# with no signal. This shim closes that gap from the producing side.
#
# It is a BRIDGE, not the destination. Teaching the shared
# `reusable-release-dispatch.yml` to fan out to adopters as well would remove
# the need for this file, and that single-sourcing is livespec-dev-tooling's
# call rather than this repo's — filed with that owner named. Until then, a
# release published here reaches the adopters that consume it.
#
# The payload shape is deliberately IDENTICAL to the fleet lane's
# (`sibling-released` carrying source_repo + tag + release_url), so an adopter
# needs one receiving lane, not two, and the fleet fix can take over
# transparently.
#
# THE TAG IS PUSHED AS AN OPTIMIZATION, NOT BECAUSE PULLING IS IMPOSSIBLE.
#
# This comment used to read: "an adopter's own `GITHUB_TOKEN` is scoped to that
# adopter and cannot read this private repo's releases, so a poll-based design
# is not available to them." Every clause of that is wrong, and it was
# load-bearing wrong — it is the premise that made this push lane look like the
# only option and left the pinned adopters with no working lane at all.
#
# THIS REPOSITORY IS PUBLIC. `releases/latest` answers 200 with no credential
# whatsoever, so any adopter can resolve the newest tag with its own
# `GITHUB_TOKEN` — including a PRIVATE adopter, since what governs the read is
# the visibility of the repository being READ. Both pinned adopters now do
# exactly that on a daily schedule, and that pull is what actually advances
# their pins.
#
# Keep this lane anyway: when the boundary IS authorized, push turns a
# once-a-day advance into an immediate one. But read the delivery numbers
# honestly — on v0.13.0 this job reported `delivered: 0, unauthorized: 3`.
# A lane that has never delivered is not the lane keeping consumers fresh.
#
# Reading the fleet manifest here is a HARNESS concern and does not touch the
# daemon's discovery boundary: the supervision daemon still reads only a
# family's own `~/.livespec-overseer-repos.json`, and nothing in this workflow
# becomes an input to it.
#
# Auth: cross-repo `repository_dispatch` needs an identity with access to the
# target repository, which `GITHUB_TOKEN` does not have, so each dispatch is
# authenticated with a GitHub App installation token minted for the target's
# RESOLVED OWNER (SPECIFICATION/non-functional-requirements.md §"Contracts",
# overseer-j4ejek). One token per distinct resolved owner, by this rule:
#   (i)   the owner's dedicated secret pair, when present. For `thewoolleyman`
#         that is ADOPTER_APP_ID_THEWOOLLEYMAN / ADOPTER_APP_PRIVATE_KEY_THEWOOLLEYMAN
#         (thewoolleyman-factory-bot, the App installed on that account);
#   (ii)  otherwise, when the owner equals this repository's own owner, the
#         repository's own App pair, APP_ID / APP_PRIVATE_KEY (after the org
#         transfer that is the `livespec-ai` route);
#   (iii) otherwise no token: that owner's adopters are reported "not
#         authorized", named and counted, and the run does not fail.
# A mint step SKIPPED because its secret pair is absent falls through these
# rules as above. A mint step that RUNS (its pair is present) and FAILS (bad
# key, App not installed, API error) is a fault, not a boundary: the run fails
# with "token mint failed for <owner>", and that owner's adopters are counted
# as failed. `mi-homelab` has no App this workflow holds a credential for, so
# it always falls to (iii).
#
# The TARGET owner comes only from the manifest resolution
# `<adopter.owner or adopter_owner or owner>/<repo>` (livespec v247,
# livespec#3242), never from this repository's own owner; the repository's own
# owner only selects which credential rule (ii) may use.
#
# So this job distinguishes outcomes, because conflating them is how a real
# misconfiguration would hide behind an expected one:
#   - An adopter with no credential for its owner, or a 403/404 from the
#     dispatch (App not installed on that repo, or installed without dispatch
#     permission) -> "not authorized": named in the log, counted in the summary,
#     and the run exits 0. A published release must not be reported as failed
#     because a boundary has not been authorized yet.
#   - Any other dispatch failure -> a fault. Fail the run, naming the adopter.

name: Adopter release dispatch (fan-out to adopters)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to announce (concrete version, e.g. v0.12.3)
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      # Presence flags only; the secret values never reach a step's env here.
      HAS_THEWOOLLEYMAN_PAIR: ${{ secrets.ADOPTER_APP_ID_THEWOOLLEYMAN != '' && secrets.ADOPTER_APP_PRIVATE_KEY_THEWOOLLEYMAN != '' }}
      HAS_OWN_PAIR: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint token for thewoolleyman (dedicated pair, rule i)
        id: token-thewoolleyman
        if: env.HAS_THEWOOLLEYMAN_PAIR == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ADOPTER_APP_ID_THEWOOLLEYMAN }}
          private-key: ${{ secrets.ADOPTER_APP_PRIVATE_KEY_THEWOOLLEYMAN }}
          owner: thewoolleyman

      - name: Mint token for this repository's own owner (APP_ID, rule ii)
        id: token-own
        if: env.HAS_OWN_PAIR == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Read and resolve the adopter list from the fleet manifest
        id: adopters
        env:
          # livespec core is public, so the job token reads the manifest when
          # the own-owner mint is unavailable.
          GH_TOKEN: ${{ steps.token-own.outputs.token || github.token }}
          MANIFEST_OWNER: ${{ github.repository_owner }}
        run: |
          # livespec core owns fleet-level facts; the manifest is fetched from
          # its default branch at run time, the same source the fleet lane uses.
          manifest=$(gh api \
            "repos/$MANIFEST_OWNER/livespec/contents/.livespec-fleet-manifest.jsonc" \
            --jq '.content' | base64 -d | sed 's|^[[:space:]]*//.*$||')
          # Resolve each adopter as <adopter.owner or adopter_owner or owner>/<repo>.
          if ! adopters=$(printf '%s' "$manifest" | jq -ce '
                (.adopter_owner // .owner) as $default
                | [.adopters[] | {owner: (.owner // $default), repo: .repo}]
                | if all(.[]; (.owner | type) == "string" and .owner != ""
                              and (.repo | type) == "string" and .repo != "")
                  then . else error("an adopter has no resolvable owner or repo") end'); then
            echo "::error::fleet manifest did not resolve into an adopters array of <owner>/<repo>" >&2
            printf '%s' "$manifest" | head -20 >&2
            exit 1
          fi
          echo "adopters=$adopters" >> "$GITHUB_OUTPUT"
          echo "::notice::manifest lists $(printf '%s' "$adopters" | jq 'length') adopter(s): $(printf '%s' "$adopters" | jq -r 'map(.owner + "/" + .repo) | join(", ")')"

      - name: Dispatch sibling-released to each adopter
        env:
          ADOPTERS: ${{ steps.adopters.outputs.adopters }}
          OWN_OWNER: ${{ github.repository_owner }}
          TOKEN_THEWOOLLEYMAN: ${{ steps.token-thewoolleyman.outputs.token }}
          TOKEN_OWN: ${{ steps.token-own.outputs.token }}
          # skipped = pair absent; failure = pair present and the mint failed.
          MINT_THEWOOLLEYMAN_OUTCOME: ${{ steps.token-thewoolleyman.outcome }}
          MINT_OWN_OUTCOME: ${{ steps.token-own.outcome }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          url="$RELEASE_URL"
          if [ -z "$url" ]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          fi
          # The token for a resolved owner, by rules (i)-(iii) in the header.
          # Prints the token, or the word MINT_FAILED when the rule that applies
          # names a mint step that ran and failed, or nothing for rule (iii).
          token_for() {
            if [ "$1" = thewoolleyman ] && [ "$MINT_THEWOOLLEYMAN_OUTCOME" = failure ]; then
              printf 'MINT_FAILED'
            elif [ "$1" = thewoolleyman ] && [ -n "$TOKEN_THEWOOLLEYMAN" ]; then
              printf '%s' "$TOKEN_THEWOOLLEYMAN"
            elif [ "$1" = "$OWN_OWNER" ] && [ "$MINT_OWN_OUTCOME" = failure ]; then
              printf 'MINT_FAILED'
            elif [ "$1" = "$OWN_OWNER" ] && [ -n "$TOKEN_OWN" ]; then
              printf '%s' "$TOKEN_OWN"
            fi
          }
          mint_failed=""
          if [ "$MINT_THEWOOLLEYMAN_OUTCOME" = failure ]; then
            echo "::error::token mint failed for thewoolleyman (ADOPTER_APP_ID_THEWOOLLEYMAN / ADOPTER_APP_PRIVATE_KEY_THEWOOLLEYMAN are set but the mint step failed)"
            mint_failed="$mint_failed thewoolleyman"
          fi
          if [ "$MINT_OWN_OUTCOME" = failure ]; then
            echo "::error::token mint failed for $OWN_OWNER (APP_ID / APP_PRIVATE_KEY are set but the mint step failed)"
            mint_failed="$mint_failed $OWN_OWNER"
          fi
          delivered=0
          unauthorized=0
          failed=0
          unauthorized_names=""
          failed_names=""
          while IFS=$'\t' read -r owner repo; do
            target="$owner/$repo"
            token=$(token_for "$owner")
            if [ "$token" = MINT_FAILED ]; then
              echo "::error::$target was not dispatched: token mint failed for $owner"
              failed=$((failed + 1))
              failed_names="$failed_names $target (token mint failed for $owner)"
              continue
            fi
            if [ -z "$token" ]; then
              echo "::warning::$target is not authorized (no credential): this workflow holds no App credential for owner $owner"
              unauthorized=$((unauthorized + 1))
              unauthorized_names="$unauthorized_names $target (no credential)"
              continue
            fi
            # An adopter with no receiving lane simply ignores the event, so
            # dispatching to every adopter is safe and needs no per-repo config.
            if err=$(GH_TOKEN="$token" gh api -X POST "repos/$target/dispatches" \
                       -f event_type=sibling-released \
                       -F "client_payload[source_repo]=${GITHUB_REPOSITORY#*/}" \
                       -F "client_payload[tag]=$TAG" \
                       -F "client_payload[release_url]=$url" 2>&1); then
              echo "::notice::dispatched $TAG to $target"
              delivered=$((delivered + 1))
            elif status=$(printf '%s' "$err" | grep -oE '"status": *"40[34]"' | grep -oE '40[34]' | head -1) \
                 && [ -n "$status" ]; then
              # 404 = App not installed on that repo; 403 = installed without
              # dispatch permission. Both are the unauthorized boundary, not a
              # fault in this lane.
              echo "::warning::$target is not authorized (HTTP $status): the $owner App token cannot dispatch to it"
              unauthorized=$((unauthorized + 1))
              unauthorized_names="$unauthorized_names $target (HTTP $status)"
            else
              echo "::error::dispatch to $target failed: $err"
              failed=$((failed + 1))
              failed_names="$failed_names $target"
            fi
          done < <(printf '%s' "$ADOPTERS" | jq -r '.[] | [.owner, .repo] | @tsv')
          {
            echo "### Adopter release dispatch — $TAG"
            echo ""
            echo "- delivered: $delivered"
            echo "- unauthorized (no App credential or access for the resolved owner): $unauthorized${unauthorized_names:+ —$unauthorized_names}"
            echo "- failed: $failed${failed_names:+ —$failed_names}"
            echo "- token mint failed for:${mint_failed:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed adopter dispatch(es) failed for a reason other than authorization:$failed_names" >&2
          fi
          if [ -n "$mint_failed" ]; then
            echo "::error::token mint failed for:$mint_failed" >&2
          fi
          if [ "$failed" -gt 0 ] || [ -n "$mint_failed" ]; then
            exit 1
          fi
          if [ "$delivered" -eq 0 ] && [ "$unauthorized" -gt 0 ]; then
            echo "::notice title=Adopter delivery not authorized::No adopter was reachable, so no pinned adopter was notified of $TAG. Their receiving lanes work; only this delivery hop is unauthorized. Set the App secret pair for each resolved owner, or have each adopter pull with its own credentials."
          fi
