# adopter-release-dispatch.yml — fan out this repo's releases to ADOPTERS.
#
# Why this exists beside release-dispatch.yml: the fleet's reusable release
# fan-out builds its dispatch matrix from the fleet manifest's `fleet` array
# only — `[(.fleet // .members)[].repo | select(...)]` — so the manifest's
# `adopters` array is never dispatched to. An adopter that pins a CONCRETE
# release tag therefore never learns a release happened, and its pin goes stale
# with no signal. This shim closes that gap from the producing side.
#
# It is a BRIDGE, not the destination. Teaching the shared
# `reusable-release-dispatch.yml` to fan out to adopters as well would remove
# the need for this file, and that single-sourcing is livespec-dev-tooling's
# call rather than this repo's — filed with that owner named. Until then, a
# release published here reaches the adopters that consume it.
#
# The payload shape is deliberately IDENTICAL to the fleet lane's
# (`sibling-released` carrying source_repo + tag + release_url), so an adopter
# needs one receiving lane, not two, and the fleet fix can take over
# transparently.
#
# The tag is PUSHED rather than pulled on purpose: an adopter's own
# `GITHUB_TOKEN` is scoped to that adopter and cannot read this private repo's
# releases, so a poll-based design is not available to them.
#
# Reading the fleet manifest here is a HARNESS concern and does not touch the
# daemon's discovery boundary: the supervision daemon still reads only a
# family's own `~/.livespec-overseer-repos.json`, and nothing in this workflow
# becomes an input to it.
#
# Auth: mints the livespec GitHub App installation token, mirroring
# release-please.yml — cross-repo `repository_dispatch` needs an identity with
# access to the target repositories, which `GITHUB_TOKEN` does not have.

name: Adopter release dispatch (fan-out to adopters)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to announce (concrete version, e.g. v0.12.3)
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Read the adopter list from the fleet manifest
        id: adopters
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # livespec core owns fleet-level facts; the manifest is fetched from
          # its default branch at run time, the same source the fleet lane uses.
          manifest=$(gh api \
            "repos/$OWNER/livespec/contents/.livespec-fleet-manifest.jsonc" \
            --jq '.content' | base64 -d | sed 's|^[[:space:]]*//.*$||')
          if ! adopters=$(printf '%s' "$manifest" | jq -ce '[.adopters[].repo]'); then
            echo "::error::fleet manifest did not parse into an adopters array" >&2
            printf '%s' "$manifest" | head -20 >&2
            exit 1
          fi
          echo "adopters=$adopters" >> "$GITHUB_OUTPUT"
          echo "::notice::manifest lists $(printf '%s' "$adopters" | jq 'length') adopter(s)"

      - name: Dispatch sibling-released to each adopter
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          ADOPTERS: ${{ steps.adopters.outputs.adopters }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          url="$RELEASE_URL"
          if [ -z "$url" ]; then
            url="https://github.com/$OWNER/${GITHUB_REPOSITORY#*/}/releases/tag/$TAG"
          fi
          failed=0
          for repo in $(printf '%s' "$ADOPTERS" | jq -r '.[]'); do
            # An adopter with no receiving lane simply ignores the event, so
            # dispatching to every adopter is safe and needs no per-repo config.
            # A single unreachable adopter must not suppress the others, so
            # failures are collected and reported at the end.
            if gh api -X POST "repos/$OWNER/$repo/dispatches" \
                 -f event_type=sibling-released \
                 -F "client_payload[source_repo]=${GITHUB_REPOSITORY#*/}" \
                 -F "client_payload[tag]=$TAG" \
                 -F "client_payload[release_url]=$url"; then
              echo "::notice::dispatched $TAG to $repo"
            else
              echo "::warning::could not dispatch to $repo"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed adopter dispatch(es) failed" >&2
            exit 1
          fi
