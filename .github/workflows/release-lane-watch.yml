# release-lane-watch.yml — livespec-overseer's shim onto the shared release-lane
# watcher.
#
# Authority: plan/fleet-delivery-lane-visibility (epic livespec-n33rwg),
#   carrier livespec-n33rwg.5, criterion 4 (relocate, do not duplicate).
#   This REPLACES overseer's former private fork (the deleted
#   scripts/release-lane-watch.py + overseer/release_lane_watch.py +
#   tests/test_release_lane_watch.py) with a thin call to
#   livespec-dev-tooling's reusable-release-lane-watch.yml, which surveys each
#   named lane and reconciles ONE durable `release-lane-red` issue for this repo
#   (opening or updating it while a lane is failing or unmeasurable, closing it
#   on recovery). That issue is READ by needs-attention-internal Signal 9 Shape C
#   — the durable signal is the issue, not this scheduled run. The private fork
#   redded its own cron job with annotations, which no signal read; the shared
#   watcher's issue is what converts noticing into a read signal.
#
# WATCHED SET — this repo's own release lanes, one WITH a release object and one
#   WITHOUT, matching the fork's former coverage and the carrier's amendment that
#   the fan-out must include a no-release-object lane or it is mostly ceremony:
#     - release-tag.yml       — the tag/release lane (has a release object).
#     - release-readiness.yml — the readiness canary; it publishes NO release
#                               object, so Signal 9 structurally cannot see it,
#                               which is exactly where the watcher earns its keep.
#
# NO `secrets: inherit`: the watcher runs on github.token with actions:read
# (lane history) and issues:write (the durable issue) and needs no App secrets.

name: Release lane watch

on:
  schedule:
    # 06:23 UTC — off the hour, and not sharing a minute with this repo's other
    # canaries (release-readiness runs at 13:47).
    - cron: '23 6 * * *'
  workflow_dispatch: {}

jobs:
  watch:
    permissions:
      actions: read
      contents: read
      issues: write
    uses: thewoolleyman/livespec-dev-tooling/.github/workflows/reusable-release-lane-watch.yml@v1.80.0
    with:
      workflows: "release-tag.yml release-readiness.yml"
