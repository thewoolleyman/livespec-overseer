# livespec-overseer — Control-Plane operator tool (repo class `control-plane-tool`).
#
# NOTE ON SHAPE. This file deliberately carries a FULL gate configuration rather
# than the minimal "a pin and nothing else" shape `livespec-console-beads-fabro`
# uses. The console is pure Rust and needs Python only to reuse the shared
# commit-refuse hook installer; this repo IS Python, and its ruff / pyright-strict
# / 100%-coverage gates are configured HERE. Seven config rows were relocated
# verbatim from livespec core's pyproject when the overseer moved out; dropping
# any of them silently retires a gate the folder earned.

[project]
name = "livespec-overseer"
version = "1.33.1"
description = "Control-Plane operator tool for livespec: a two-pane tmux supervisor that watches tracked sessions' context headroom, injects an escalating wrap-up at threshold, and restarts a session only once it declares itself ready. Peer of livespec-console-beads-fabro, not a component of it."
requires-python = ">=3.10.16"
authors = [
    { name = "Chad Woolley", email = "thewoolleyman@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"

# One runtime dependency, deliberately. The supervisor package remains stdlib-only
# (argparse, json, pathlib, subprocess, fcntl, re, os, sys, time, traceback,
# dataclasses, typing, contextlib, datetime, itertools, shlex, tempfile,
# collections) plus its own modules. The project-level livespec-runtime
# dependency is for repo-local governance checks, not overseer runtime imports.
dependencies = [
    "livespec-runtime>=0.18.0",
]

[project.scripts]
foreman-act = "overseer.foreman_act:main"
foreman-consensus = "overseer.foreman_consensus:main"
foreman-gather = "overseer.foreman_gather:main"
foreman-panel = "overseer.foreman_panel:main"
foreman-plan-roster = "overseer.foreman_plan_roster:main"
foreman-valve-disposition = "overseer.foreman_valve_policy:main"
overseer-declare = "overseer.declare:main"
overseer-scan-homelab-charters = "overseer.homelab_charter_scan:main"
overseerd = "overseer.daemon:main"
overseer-start = "overseer.start:main"

[dependency-groups]
# Every Python dev tool is uv-managed here (resolved into uv.lock, installed
# into a project-local .venv via `uv sync --all-groups`). Mise pins only the
# non-Python binaries in .mise.toml. Versions mirror livespec core's pins
# exactly per livespec/SPECIFICATION/non-functional-requirements.md
# §"Shared content provenance".
dev = [
    "ruff==0.8.6",
    "pyright==1.1.391",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-icdiff==0.9",
    "pytest-xdist==3.8.0",
    "livespec-dev-tooling",
]

[tool.uv.sources]
# Pinned to the release that introduced this repo's own class,
# `control-plane-tool` (livespec-dev-tooling PR #502). As a pin-CONSUMING class
# this repo receives automatic bump-pin PRs — that participation is the whole
# reason the `console` class could not be reused, since `_PIN_WEB_CLASSES` is
# the subtraction set `_ALL_CLASSES - {"console"}`.
livespec-dev-tooling = { git = "https://github.com/thewoolleyman/livespec-dev-tooling.git", tag = "v1.32.0" }
livespec-runtime = { git = "https://github.com/thewoolleyman/livespec-runtime.git", tag = "v0.21.3" }

[tool.livespec_dev_tooling]
# Role trees. This section must exist at all: without it the loader falls back to
# defaults naming core's layout (`.claude-plugin/scripts/livespec`, `.../io`,
# `.../commands`, `.../parse`, `dev-tooling`), none of which exist here, and
# `check-source-trees-scoped-to-consumer` fails with six "role is not scoped to
# this consumer" errors.
#
# ARMED 2026-07-27 (`overseer-bg2.4`). `source_trees` and `covered_trees` name the
# package and `file_lloc_hard_gate` is true, so >250 LLOC hard-fails here rather
# than warning.
#
# WHAT ARMING TURNED ON, so a reader knows what these two entries cost: declaring
# `source_trees` ACTIVATES the Result-railway checks (`no-raise-outside-io`,
# `no-except-outside-io`, `public-api-result-typed`) over this package, alongside
# `check-keyword-only-args`, `check-private-calls`, `check-all-declared` and
# `check-no-inheritance` at ERROR severity. That is Gate E of
# plan/overseer-productization, whose whole hazard is enforcement landing before
# adoption — so the blast radius was MEASURED, not assumed, and the flip waited on
# a real zero: full `just check` 61/61 green with every key below already set.
#
# Reaching that zero took the whole `overseer-bg2` epic and one upstream change:
# the loop-iteration broad catch deleted (`bg2.2`), the over-ceiling files split
# (`bg2.3`, `overseer-hfx`), `__all__` declared on every module (`bg2.7`), the
# inheritance-based double reshaped (`bg2.8`), the surface made keyword-only
# (`bg2.9`, 673 diagnostics to 1), and `check-keyword-only-args` taught the
# externally-fixed-calling-convention exception upstream in
# `livespec-dev-tooling` v0.54.27 (`livespec-dev-tooling-2prg`), which is why the
# pin above is not free to move backwards.
#
# HISTORY — do NOT resurrect either retired argument. This block first argued that
# core had the same keys empty, so matching it kept things behavior-preserving;
# that parity claim EXPIRED on 2026-07-26 when core armed its own. It then argued
# that the keys stayed empty because the blast radius was unmeasured; that reason
# expired when the radius was measured at zero. Neither is a reason to un-arm.
source_trees = ["overseer"]
io_trees = []
commands_trees = []
# UNARMED, not not-applicable, and NOT an oversight: `pure_trees` arming is gated
# on `livespec-mutreal.1`, exactly as it is in core. The concept applies here and
# is switched off pending that named work, so the blocking ledger id now lives in
# the PARSED VALUE rather than in this comment (livespec-dev-tooling-8o8e.1).
pure_trees = { unarmed_until = "livespec-mutreal.1" }
covered_trees = ["overseer"]
# The PreToolUse guard hook is a supervisor entry artifact: its `main()` carries
# the ONE fail-open boundary catch livespec non-functional-requirements.md line
# 114 grants a hook, and the file owns the hook-protocol stdout contract that
# `no_write_direct` otherwise bans. Listing it here is what makes both
# exemptions legible, and it also exempts its `sys.exit` from
# `check-supervisor-discipline`. It is deliberately NOT in `io_trees`: the same
# clause forecloses exempting a hook tree wholesale ("There is NO 'thin repo'
# exemption").
supervisor_entry_files = [".claude/hooks/livespec_footgun_guard.py"]

# livespec v179 member 2. Each entry declares that this function's `X | None`
# models a legitimate ABSENCE rather than a FAILURE, which no AST can decide --
# member 1 refuses the whole shape for exactly that reason, and this key is the
# narrow DECLARED relief.
#
# ⛔ RELAXING-ONLY. An entry here REMOVES a function from the Result-return rule,
# so the tightening-only argument that bounds `cross_repo_public_api` is NOT
# available and must not be carried across. Bounds 1 and 3 HARD-FAIL: an entry
# whose subject vanishes, or is refactored out of the `X | None` shape, fails the
# check rather than being ignored.
#
# ▶️ WHY ONLY THREE, when the structural gate would permit 637 in this repo and
# 41 convicted functions are shaped for it: the gate cannot decide absence versus
# failure, and reading the definitions showed the answer is NOT uniform. These
# three are the ones whose `None` is unambiguously an absence. Declaring the rest
# as a batch would buy exemptions they do not qualify for, in the one direction
# that must not err.
#
# ⛔ DELIBERATELY NOT DECLARED, recorded so nobody adds them assuming an oversight:
#   - `parse_object` / `parse_object_line` return None for MALFORMED JSON *and*
#     for well-formed non-objects. That is a FAILURE and an ABSENCE collapsed into
#     one value, and this codebase already knows it: `as_object`'s docstring exists
#     for "callers that must keep their own try/except around the parse ... because
#     they report a malformed file and a well-formed non-object file with DIFFERENT
#     diagnostics". Those two want CONVERSION, not a declaration.
#   - The five `proc_*` readers conflate "process gone" (absence) with "unreadable"
#     (failure) behind a call site that treats both as "not live". Defensible, but a
#     judgment to be made knowingly rather than in a batch. Raised, not decided.
#
# ⚠️ `pyproject.toml` is NOT part of the byte-identical `.claude-plugin/overseer/`
# mirror and no check holds the two halves equal, so each function is declared
# TWICE -- once per tree -- and omitting the mirror half silently halves the relief.
total_absence_returns = [
    { file = "overseer/jsonio.py", function = "as_object", reason = "Narrows an ALREADY-PARSED JSON value to a string-keyed mapping. Total on its input, performs no I/O, and cannot fail: None means the value is not a dict, which is an ANSWER about the value's shape rather than a failure to obtain it. The parse -- the only step that can fail -- happens in the caller, which is the entire reason this narrowing form is separate from parse_object." },
    { file = "overseer/jsonio.py", function = "as_list", reason = "The list sibling of as_object, absent for the same reason: it narrows an ALREADY-PARSED value and None means the value is not a list. Total, no I/O, nothing to fail. It exists because isinstance() narrows only to list[Unknown], so the per-element checks that follow stop meaning anything to a type checker -- a typing concern, not an error path." },
    { file = "overseer/jsonio.py", function = "as_float", reason = "Coerces an ALREADY-PARSED JSON scalar to a float. None means the value is not numeric -- an object, an array, null, a non-numeric string, or a bool, which is rejected deliberately because it is an int subclass and would otherwise yield 1.0 from something that was never a number. Its own docstring states the contract this declaration asserts: every caller treats a non-numeric value as 'no value' rather than 'as an error worth raising'. Total, no I/O." },
    { file = ".claude-plugin/overseer/jsonio.py", function = "as_object", reason = "Narrows an ALREADY-PARSED JSON value to a string-keyed mapping. Total on its input, performs no I/O, and cannot fail: None means the value is not a dict, which is an ANSWER about the value's shape rather than a failure to obtain it. The parse -- the only step that can fail -- happens in the caller, which is the entire reason this narrowing form is separate from parse_object." },
    { file = ".claude-plugin/overseer/jsonio.py", function = "as_list", reason = "The list sibling of as_object, absent for the same reason: it narrows an ALREADY-PARSED value and None means the value is not a list. Total, no I/O, nothing to fail. It exists because isinstance() narrows only to list[Unknown], so the per-element checks that follow stop meaning anything to a type checker -- a typing concern, not an error path." },
    { file = ".claude-plugin/overseer/jsonio.py", function = "as_float", reason = "Coerces an ALREADY-PARSED JSON scalar to a float. None means the value is not numeric -- an object, an array, null, a non-numeric string, or a bool, which is rejected deliberately because it is an int subclass and would otherwise yield 1.0 from something that was never a number. Its own docstring states the contract this declaration asserts: every caller treats a non-numeric value as 'no value' rather than 'as an error worth raising'. Total, no I/O." },

    # ---- the five /proc readers of claude_sessions.py ----
    # MAINTAINER RULING 2026-08-21 (recorded on livespec-dev-tooling-8o8e,
    # 2026-08-21T12:33:38Z): "Session decides per function ... write the reason,
    # as it did for the first ten ... you review the reasons in the PR."
    #
    # ⚠️ THE ARGUABLE PART, STATED RATHER THAN SMOOTHED OVER, because bound 2
    # exists to surface exactly this. Each reader returns None on OSError, which
    # covers BOTH "no such process" (ESRCH -- an absence) AND "not permitted"
    # (EACCES -- arguably a failure). They are conflated deliberately.
    #
    # ▶️ WHY THAT IS STILL AN ABSENCE HERE, and not a failure wearing an
    # Optional: /proc is a SYNTHETIC filesystem in which the absence of an entry
    # IS the kernel's answer to "does this process exist". A reader of
    # /proc/<pid>/x is not attempting an operation that can fail so much as
    # asking a question whose negative answer is delivered as ENOENT. And the
    # EACCES case resolves the same way for THIS consumer: the overseer
    # enumerates ITS OWN sessions, so a process it may not read is a process
    # that is not one of its own -- the same answer, "not live", by a different
    # route. Every call site treats it that way.
    #
    # ⚠️ RESIDUAL A REVIEWER SHOULD WEIGH: the stat-backed pair additionally
    # returns None when /proc/<pid>/stat has no ")" or too few fields, or when
    # int() rejects the field. Those are MALFORMED-INPUT branches -- genuine
    # failures -- and they are unreachable only because the kernel guarantees
    # stat's format. They are defensive code against something that cannot
    # happen, not expected outcomes. If that guarantee is ever the wrong thing
    # to lean on, these two entries are the first to withdraw.
    { file = "overseer/claude_sessions.py", function = "proc_ppid", reason = "The parent PID from /proc/<pid>/stat, or None when there is no such process. In procfs the absence of the entry IS the answer, so None is an absence rather than a failed read. ⚠️ Also None if stat is malformed or the field is not an int -- defensive branches against a format the kernel guarantees; see the note above." },
    { file = "overseer/claude_sessions.py", function = "proc_starttime", reason = "The process start-time from /proc/<pid>/stat, returned as a string so it compares byte-for-byte against the registry's procStart. Its own docstring names the contract this declaration asserts: None when the process is gone or unreadable, 'which the caller treats as not live'. One meaning at every call site. ⚠️ Shares the malformed-stat residual noted above." },
    { file = "overseer/claude_sessions.py", function = "proc_comm", reason = "The command name from /proc/<pid>/comm, or None when there is no such process. Also None when comm is empty after stripping -- a process with no command name is a legitimate absence of the value, not a failure to read it." },
    { file = "overseer/claude_sessions.py", function = "proc_cmdline", reason = "Raw /proc/<pid>/cmdline bytes, or None when there is no such process. Also None when cmdline is EMPTY, which is the normal case for a kernel thread -- an unambiguous absence of the value rather than a failed read, and the clearest of the five." },
    { file = "overseer/claude_sessions.py", function = "proc_environ", reason = "Raw /proc/<pid>/environ bytes, or None when there is no such process, or when environ is empty. Same shape as proc_cmdline: procfs delivers non-existence as ENOENT, and an empty environ is an absent value rather than a failure." },
    { file = ".claude-plugin/overseer/claude_sessions.py", function = "proc_ppid", reason = "The parent PID from /proc/<pid>/stat, or None when there is no such process. In procfs the absence of the entry IS the answer, so None is an absence rather than a failed read. ⚠️ Also None if stat is malformed or the field is not an int -- defensive branches against a format the kernel guarantees; see the note above." },
    { file = ".claude-plugin/overseer/claude_sessions.py", function = "proc_starttime", reason = "The process start-time from /proc/<pid>/stat, returned as a string so it compares byte-for-byte against the registry's procStart. Its own docstring names the contract this declaration asserts: None when the process is gone or unreadable, 'which the caller treats as not live'. One meaning at every call site. ⚠️ Shares the malformed-stat residual noted above." },
    { file = ".claude-plugin/overseer/claude_sessions.py", function = "proc_comm", reason = "The command name from /proc/<pid>/comm, or None when there is no such process. Also None when comm is empty after stripping -- a process with no command name is a legitimate absence of the value, not a failure to read it." },
    { file = ".claude-plugin/overseer/claude_sessions.py", function = "proc_cmdline", reason = "Raw /proc/<pid>/cmdline bytes, or None when there is no such process. Also None when cmdline is EMPTY, which is the normal case for a kernel thread -- an unambiguous absence of the value rather than a failed read, and the clearest of the five." },
    { file = ".claude-plugin/overseer/claude_sessions.py", function = "proc_environ", reason = "Raw /proc/<pid>/environ bytes, or None when there is no such process, or when environ is empty. Same shape as proc_cmdline: procfs delivers non-existence as ENOENT, and an empty environ is an absent value rather than a failure." },

    # ================= ROUND 2, 2026-08-21, at master a2f4d18 =================
    # ⛔ RESTORED 2026-08-21: these 32 entries landed in 0c4f11c and were SILENTLY
    # DELETED 2.5 minutes later by `356b68b chore(master): release 1.11.0`, whose
    # single parent IS 0c4f11c. Release-please replayed a pyproject snapshot taken
    # BEFORE the merge; a rebase moves a commit but does not re-derive generated
    # content, so the revert recorded as an ordinary deletion with no conflict.
    # 30 convicted-and-shaped candidates were re-derived at this tip and read one
    # at a time. 16 are declared below; 14 were REFUSED because their `None`
    # collapses a FAILURE into an ABSENCE, and are filed for CONVERSION instead.
    #
    # ⚠️ THE REFUSAL RATE IS 47%, AND IT ROSE. The first round refused 2 of 10.
    # The structural gate would have accepted all 30 -- it decides bound 1 (the
    # `X | None` shape) and bound 3 (the subject resolves), and CANNOT decide the
    # only question that matters. Anyone treating the structural figure as a
    # target will buy exemptions these functions do not qualify for, on a key
    # whose polarity is RELAXING-ONLY.
    #
    # THE TEST APPLIED, stated so a reviewer can check the judgment rather than
    # the arithmetic: a `None` is an ABSENCE when every route to it answers the
    # function's OWN question negatively, and a FAILURE when some route means
    # "I could not obtain an answer". Fallible I/O, a parse, or a guard tripping
    # are the three shapes that make it the latter. Residuals are named in the
    # entry rather than smoothed away.
    { file = "overseer/codex_sessions.py", function = "proc_cwd", reason = "Resolves /proc/<pid>/cwd, or None when there is no such process. Same family and same judgment as the five /proc readers of claude_sessions.py declared under the maintainer ruling of 2026-08-21T12:33:38Z: procfs is a SYNTHETIC filesystem in which the absence of the entry IS the kernel's answer to 'does this process exist', so the reader asks a question whose negative answer is ENOENT rather than attempting a fallible operation. The EACCES route resolves identically for this consumer, which enumerates its OWN sessions." },
    { file = "overseer/codex_sessions.py", function = "rollout_id", reason = "Extracts the session id embedded in a rollout FILENAME by regex. Pure, total, no I/O, no fallible step: None means the string is not a rollout filename, which is an ANSWER about the path's shape rather than a failure to obtain anything. The cleanest absence in this file." },
    { file = "overseer/codex_sessions.py", function = "open_rollout_id", reason = "Selects the first element of open_rollout_ids(), or None when that list is empty. The docstring narrows it explicitly to 'the structural fact that a rollout fd is open', and every route to an empty list answers that question 'no': the pid holds no rollout, or the pid is gone. ⚠️ RESIDUAL: proc_fd_targets is fail-soft to [] on EPERM as well, so an unreadable fd table also reads as 'no rollout open'. That is the same EACCES argument the /proc readers were declared under -- the overseer enumerates its own sessions -- and it is the conservative direction for a liveness probe." },
    { file = "overseer/foreman_act_revalidate.py", function = "revalidate_identity", reason = "INVERTED shape: returns a REFUSAL REASON, and None means 'no reason to refuse -- the identity revalidates'. Every failure mode is returned IN-BAND as a distinct named string ('malformed_proposal', 'repo_identity_changed', 'daemon_identity_changed', 'tick_generation_changed', 'session_identity_changed'), so nothing fallible is collapsed into the None. None is the absence OF A REASON, which is the success case, not a swallowed failure." },
    { file = "overseer/foreman_act_revalidate.py", function = "revalidate_source", reason = "Same inverted shape as revalidate_identity: returns a named refusal reason ('unsupported_gather_schema', 'snapshot_not_actable') and None only when the source IS actable. No fallible step reaches the None; every rejection carries its own string." },
    { file = "overseer/foreman_act_revalidate.py", function = "str_field", reason = "Reads one key from an ALREADY-PARSED mapping and returns it only when it is a str. Total, no I/O, nothing to fail: None means 'that key is absent or is not a string', an answer about the value's shape. Same family as jsonio.as_object / as_list, which are declared on the same basis." },
    { file = "overseer/foreman_consensus_actions.py", function = "model_for", reason = "Linear lookup of a reviewer_id in the MODEL_IDENTITIES table. Pure, total, no I/O. None means 'no identity carries that reviewer_id' -- a lookup miss, which is the textbook absence." },
    { file = "overseer/foreman_consensus_actions.py", function = "typed_action", reason = "Narrows an ALREADY-PARSED value to a well-formed action. Every None branch is a SHAPE verdict over a value already in hand -- not an object, action_id not a known member of ACTION_ID_SET, params not an object -- and no branch attempts a fallible operation. It differs from jsonio.parse_object, which IS refused, precisely because there is no parse here: the failure that could have been conflated happens in the caller." },
    { file = "overseer/foreman_consensus_cache.py", function = "read_cached_verdict", reason = "A CACHE READ, where every route to None is the single coherent answer 'no usable cached verdict; recompute'. A cold cache, an expired TTL, a corrupt entry and a malformed record are not distinguishable OUTCOMES for the caller -- all four mean the same recompute -- so the collapse is the contract rather than a loss. ⚠️ RESIDUAL: a persistently corrupt cache file is therefore indistinguishable from a permanently cold one and would disable caching silently; that is a telemetry gap, not a correctness one, because the recompute path is always correct." },
    { file = "overseer/foreman_gather_release_lane.py", function = "attention_with_release_lane", reason = "Merges an optional release-lane item into an optional attention document. Pure, total, no I/O. When there is no item it returns the attention argument UNCHANGED, so a None result is the caller's own None passed through -- 'there was no attention document and nothing to add to it'. Nothing here can fail." },
    { file = "overseer/foreman_gather_sources.py", function = "default_needs_attention_command", reason = "Answers 'does this repo carry a needs-attention source, and what command reads it?'. None means NEITHER needs_attention.py NOR the attention.json fixture is present -- a configuration question answered negatively, which every caller treats as 'this repo has no such source'. ⚠️ RESIDUAL: Path.is_file() returns False rather than raising on an unreadable parent, so an inaccessible repo also reads as 'not configured'; the consumer's response is identical either way." },
    { file = "overseer/foreman_gather_sources.py", function = "string_list", reason = "Narrows an ALREADY-PARSED value to list[str], returning None when it is not a list or any element is not a str. Total, no I/O, nothing fallible: this is jsonio.as_list with an element-type predicate, and it is declared on exactly the basis as_list was." },
    { file = "overseer/foreman_pane_claim.py", function = "active_pane_claim", reason = "Answers one narrow question -- 'does THIS session hold a live claim on THIS pane?' -- and every None branch answers it 'no': no claim file, an expired claim, or a claim owned by another owner/session/pane. ⚠️ RESIDUAL: an OSError reading the claim file also returns None, so an unreadable claim reads as 'not held by me'. That is the CONSERVATIVE direction for a claim check -- it declines to assert ownership it cannot prove -- which is why the conflation is safe here and would not be in the inverse." },
    { file = "overseer/foreman_panel_refusal.py", function = "refusal_for", reason = "Scans a blocked-question string for known hint tokens and returns a refusal only when one matches. Pure, total, no I/O. None means 'no hint token is present, so no refusal is warranted' -- the absence of a reason to refuse, the same inverted shape as revalidate_source." },
    { file = "overseer/grooming_conformance_values.py", function = "merged_acceptance_criteria", reason = "Reads acceptance criteria from an ALREADY-PARSED item, falling back from the native field to the metadata block. Pure, total, no I/O. None means 'neither location carries non-blank acceptance criteria' -- an absence of content, and the callers treat a missing criterion as exactly that." },
    { file = "overseer/signals.py", function = "input_box_text", reason = "A pure scan of captured pane TEXT for a non-empty composer box bounded above and below by borders. No I/O and nothing fallible -- the capture already happened in the caller. None means 'no such box is visible in this text', which is a statement about the pane, not a failure to read it." },
    { file = ".claude-plugin/overseer/codex_sessions.py", function = "proc_cwd", reason = "Resolves /proc/<pid>/cwd, or None when there is no such process. Same family and same judgment as the five /proc readers of claude_sessions.py declared under the maintainer ruling of 2026-08-21T12:33:38Z: procfs is a SYNTHETIC filesystem in which the absence of the entry IS the kernel's answer to 'does this process exist', so the reader asks a question whose negative answer is ENOENT rather than attempting a fallible operation. The EACCES route resolves identically for this consumer, which enumerates its OWN sessions." },
    { file = ".claude-plugin/overseer/codex_sessions.py", function = "rollout_id", reason = "Extracts the session id embedded in a rollout FILENAME by regex. Pure, total, no I/O, no fallible step: None means the string is not a rollout filename, which is an ANSWER about the path's shape rather than a failure to obtain anything. The cleanest absence in this file." },
    { file = ".claude-plugin/overseer/codex_sessions.py", function = "open_rollout_id", reason = "Selects the first element of open_rollout_ids(), or None when that list is empty. The docstring narrows it explicitly to 'the structural fact that a rollout fd is open', and every route to an empty list answers that question 'no': the pid holds no rollout, or the pid is gone. ⚠️ RESIDUAL: proc_fd_targets is fail-soft to [] on EPERM as well, so an unreadable fd table also reads as 'no rollout open'. That is the same EACCES argument the /proc readers were declared under -- the overseer enumerates its own sessions -- and it is the conservative direction for a liveness probe." },
    { file = ".claude-plugin/overseer/foreman_act_revalidate.py", function = "revalidate_identity", reason = "INVERTED shape: returns a REFUSAL REASON, and None means 'no reason to refuse -- the identity revalidates'. Every failure mode is returned IN-BAND as a distinct named string ('malformed_proposal', 'repo_identity_changed', 'daemon_identity_changed', 'tick_generation_changed', 'session_identity_changed'), so nothing fallible is collapsed into the None. None is the absence OF A REASON, which is the success case, not a swallowed failure." },
    { file = ".claude-plugin/overseer/foreman_act_revalidate.py", function = "revalidate_source", reason = "Same inverted shape as revalidate_identity: returns a named refusal reason ('unsupported_gather_schema', 'snapshot_not_actable') and None only when the source IS actable. No fallible step reaches the None; every rejection carries its own string." },
    { file = ".claude-plugin/overseer/foreman_act_revalidate.py", function = "str_field", reason = "Reads one key from an ALREADY-PARSED mapping and returns it only when it is a str. Total, no I/O, nothing to fail: None means 'that key is absent or is not a string', an answer about the value's shape. Same family as jsonio.as_object / as_list, which are declared on the same basis." },
    { file = ".claude-plugin/overseer/foreman_consensus_actions.py", function = "model_for", reason = "Linear lookup of a reviewer_id in the MODEL_IDENTITIES table. Pure, total, no I/O. None means 'no identity carries that reviewer_id' -- a lookup miss, which is the textbook absence." },
    { file = ".claude-plugin/overseer/foreman_consensus_actions.py", function = "typed_action", reason = "Narrows an ALREADY-PARSED value to a well-formed action. Every None branch is a SHAPE verdict over a value already in hand -- not an object, action_id not a known member of ACTION_ID_SET, params not an object -- and no branch attempts a fallible operation. It differs from jsonio.parse_object, which IS refused, precisely because there is no parse here: the failure that could have been conflated happens in the caller." },
    { file = ".claude-plugin/overseer/foreman_consensus_cache.py", function = "read_cached_verdict", reason = "A CACHE READ, where every route to None is the single coherent answer 'no usable cached verdict; recompute'. A cold cache, an expired TTL, a corrupt entry and a malformed record are not distinguishable OUTCOMES for the caller -- all four mean the same recompute -- so the collapse is the contract rather than a loss. ⚠️ RESIDUAL: a persistently corrupt cache file is therefore indistinguishable from a permanently cold one and would disable caching silently; that is a telemetry gap, not a correctness one, because the recompute path is always correct." },
    { file = ".claude-plugin/overseer/foreman_gather_release_lane.py", function = "attention_with_release_lane", reason = "Merges an optional release-lane item into an optional attention document. Pure, total, no I/O. When there is no item it returns the attention argument UNCHANGED, so a None result is the caller's own None passed through -- 'there was no attention document and nothing to add to it'. Nothing here can fail." },
    { file = ".claude-plugin/overseer/foreman_gather_sources.py", function = "default_needs_attention_command", reason = "Answers 'does this repo carry a needs-attention source, and what command reads it?'. None means NEITHER needs_attention.py NOR the attention.json fixture is present -- a configuration question answered negatively, which every caller treats as 'this repo has no such source'. ⚠️ RESIDUAL: Path.is_file() returns False rather than raising on an unreadable parent, so an inaccessible repo also reads as 'not configured'; the consumer's response is identical either way." },
    { file = ".claude-plugin/overseer/foreman_gather_sources.py", function = "string_list", reason = "Narrows an ALREADY-PARSED value to list[str], returning None when it is not a list or any element is not a str. Total, no I/O, nothing fallible: this is jsonio.as_list with an element-type predicate, and it is declared on exactly the basis as_list was." },
    { file = ".claude-plugin/overseer/foreman_pane_claim.py", function = "active_pane_claim", reason = "Answers one narrow question -- 'does THIS session hold a live claim on THIS pane?' -- and every None branch answers it 'no': no claim file, an expired claim, or a claim owned by another owner/session/pane. ⚠️ RESIDUAL: an OSError reading the claim file also returns None, so an unreadable claim reads as 'not held by me'. That is the CONSERVATIVE direction for a claim check -- it declines to assert ownership it cannot prove -- which is why the conflation is safe here and would not be in the inverse." },
    { file = ".claude-plugin/overseer/foreman_panel_refusal.py", function = "refusal_for", reason = "Scans a blocked-question string for known hint tokens and returns a refusal only when one matches. Pure, total, no I/O. None means 'no hint token is present, so no refusal is warranted' -- the absence of a reason to refuse, the same inverted shape as revalidate_source." },
    { file = ".claude-plugin/overseer/grooming_conformance_values.py", function = "merged_acceptance_criteria", reason = "Reads acceptance criteria from an ALREADY-PARSED item, falling back from the native field to the metadata block. Pure, total, no I/O. None means 'neither location carries non-blank acceptance criteria' -- an absence of content, and the callers treat a missing criterion as exactly that." },
    { file = ".claude-plugin/overseer/signals.py", function = "input_box_text", reason = "A pure scan of captured pane TEXT for a non-empty composer box bounded above and below by borders. No I/O and nothing fallible -- the capture already happened in the caller. None means 'no such box is visible in this text', which is a statement about the pane, not a failure to read it." },
]
file_lloc_hard_gate = true
# These four shared ONE terse "declared-empty: these roles remain unarmed" line,
# and that word covered two materially different situations. They are now split
# (livespec-dev-tooling-8o8e.1), each carrying its reason in the PARSED VALUE.
#
# CONVENTION NOT ADOPTED — the concept APPLIES and arming it would go RED today.
# `tests/` has no `tests/overseer/` mirror tree at all (only `integration/` and
# `prompts/`), so declaring `source_tree_prefixes` would redden
# `tests_mirror_pairing`; and this repo carries no per-directory CLAUDE.md layout
# for `claude_md_coverage` to walk. Neither is "does not apply here" — both are
# conventions this repo has not adopted, which is a state that should stay
# visible rather than hide behind an emptiness.
target_dirs = { convention_not_adopted = "per-directory-CLAUDE.md convention not adopted; real values would redden claude_md_coverage" }
source_tree_prefixes = { convention_not_adopted = "tests-mirror-pairing convention not adopted; this repo has no tests/overseer/ mirror tree" }
# NOT APPLICABLE — these two genuinely do not exist here: the package carries no
# dataclasses/schema tree, and the overseer is not a Driver so it installs no
# neutral shared hook body. Nothing to arm, now or later.
dataclasses_tree = { not_applicable = "the overseer package carries no dataclasses/schema tree" }
neutral_hook_body_path = { not_applicable = "the overseer is not a Driver and installs no neutral shared hook body" }

# ---------------------------------------------------------------------------
# Ruff — sole linter, formatter, import-sorter, complexity checker.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
# `.claude/hooks/**` USED to sit here, on the ground that hook scripts are
# fail-open boundary code whose blind catches and direct prints are the
# contract. The premise was right and the remedy was wrong: excluding the tree
# took the BLE001 backstop down with it, and `check-no-except-outside-io` treats
# an inspected-but-ruff-excluded file as an error precisely because the
# position rule alone is half the pair. The hook now carries a marked sole
# boundary catch and writes via `sys.stdout.write`, so it needs no exclusion at
# all — only the narrow `PLR0911` waiver below.
extend-exclude = [
    "**/_vendor/**",
    "**/__pycache__/**",
    "mutants/**",
]
# RELOCATED ROW 1/7. Ruff resolves files by EXTENSION, so the two extensionless
# executables (`overseerd`, `overseer-start` — Python with a shebang, invoked by
# bare name) are invisible to it without this. They were silently unlinted for
# months before core added this; the glob matches the folder's `overseer*`
# naming convention rather than naming them individually.
extend-include = ["overseer/overseer*"]

[tool.ruff.lint]
# Rule set copied VERBATIM from livespec core's `[tool.ruff.lint]`, which is
# what gated this code before the move. An earlier draft used `select = ["ALL"]`
# with a hand-written ignore list and produced 72 findings against code that was
# already clean — an approximated rule set is a DIFFERENT gate, not a stricter
# one. Keep this in lockstep with core's list.
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C90",   # mccabe complexity
    "N",     # pep8-naming
    "RUF",   # ruff-specific
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    "TRY",   # tryceratops
    "FBT",   # flake8-boolean-trap
    "PIE",   # flake8-pie
    "SLF",   # flake8-self
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "TID",   # flake8-tidy-imports
    "ERA",   # eradicate — bans commented-out code (LLM artifact)
    "ARG",   # flake8-unused-arguments
    "RSE",   # flake8-raise
    "PT",    # flake8-pytest-style
    "FURB",  # refurb
    "SLOT",  # flake8-slots
    "ISC",   # flake8-implicit-str-concat
    "T20",   # flake8-print — the daemon's output goes through streams.py
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
]
ignore = [
    "ISC001",  # implicit-str-concat on one line; conflicts with the formatter
    "PLC0414",
]
# Domain vocabulary: the prompt glyphs Claude Code and Codex print, which this
# tool literally parses out of real TUIs. A two-codepoint repo-wide allowance is
# NARROWER than a per-file-ignore, which would disable RUF001/2/3 across whole
# files and hide a genuinely confusable character introduced later.
allowed-confusables = ["❯", "›"]

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 6
max-branches = 10
max-statements = 30

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc.ABC" = { msg = "use typing.Protocol" }
"abc.ABCMeta" = { msg = "use typing.Protocol" }
"abc.abstractmethod" = { msg = "use typing.Protocol" }
"pickle" = { msg = "arbitrary-code-execution surface on load(); use JSON / JSONC" }
"marshal" = { msg = "arbitrary-code-execution surface on load(); use JSON / JSONC" }
"shelve" = { msg = "arbitrary-code-execution surface on load(); use JSON / JSONC" }

[tool.ruff.lint.per-file-ignores]
# The PreToolUse guard hook, replacing the wholesale `.claude/hooks/**`
# exclusion removed above so BLE001 stays LIVE over it and its sole fail-open
# boundary marker is a real directive rather than a dead one. `PLR0911` alone is
# waived: `_check_segment` returns early once per footgun pattern, and
# collapsing those branches would reshape behavior-critical guard logic that has
# no test coverage. Same disposition as livespec-driver-claude's `C901` waiver
# on `no_shadow_ledger.py`.
".claude/hooks/livespec_footgun_guard.py" = ["PLR0911"]
# RELOCATED ROW 2/7. Copied verbatim from core's
# `.claude/skills/overseer/test_*.py` entry. The first six inherit the product
# `tests/**.py` rationale; the last three are beside-test-specific — SLF001
# (testing private decision helpers directly IS the point of a beside-test) and
# ARG001/2 (signature-matching test doubles must accept args they do not use).
# ARG005 is the LAMBDA form of that same fact and was reached by the keyword-only
# conversion (`overseer-bg2.9`): a seam's Protocol fixes the KEYWORD NAME, so a
# substitute that ignores the value must still name its parameter `pid` rather than
# `_pid`. The underscore that used to say "deliberately unused" is no longer
# available, because the caller passes by keyword.
# S106 joins S105 on the identical rationale, and only became reachable when the
# keyword-only sweep turned `valid_token("redy")` into `valid_token(token="redy")`:
# ruff reads an argument NAMED `token` as a possible hardcoded credential. These are
# the daemon's STATE tokens (`ready`, `blocked`, ...) — a fixed vocabulary the tests
# must spell literally — not secrets. S105 was already granted for the same strings
# in their bare-literal form; the argument form is the same fact.
"overseer/test_*.py" = [
    "S101", "PLR2004", "PT018", "S105", "S106", "S108", "TRY003",
    "SLF001", "ARG001", "ARG002", "ARG005",
]

# The top-of-pyramid scenario tree (overseer-hbr.19). Same rationale as the
# beside-tests above: these ARE tests, so `assert` is the point (S101), magic
# comparison values are the scenario's own numbers (PLR2004), and they reach the
# harness's private helpers deliberately (SLF001) — a second FakeTmux would be a
# second thing to keep true. Kept as a SEPARATE entry rather than widening the
# glob above, so the beside-test rationale and the scenario-tree rationale stay
# independently reviewable.
"tests/**/*.py" = [
    "S101", "PLR2004", "PT018", "S105", "S108", "TRY003",
    "SLF001", "ARG001", "ARG002", "ARG005",
]

# ---------------------------------------------------------------------------
# Pyright — strict, no pragma, no suppression.
# ---------------------------------------------------------------------------

[tool.pyright]
# RELOCATED ROW 3/7. The folder PLUS the two extensionless executables named
# individually — pyright's `include` also resolves by extension, so
# `overseer` alone does NOT reach them.
include = ["overseer", "overseer/overseer-start", "overseer/overseerd"]
# RELOCATED ROW 4/7. Tests are not source. Repo-wide, pyright checks SOURCE and
# the product `tests/` tree is out of scope simply by never appearing in
# `include`. These tests live BESIDE their source, so applying the identical
# rule takes an explicit exclude rather than an omission. This is the repo's
# existing rule spelled out — NOT an overseer exemption.
exclude = ["overseer/test_*.py", "overseer/conftest.py", "**/_vendor/**", "**/__pycache__/**"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

reportUnusedCallResult = "error"
reportImplicitOverride = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
# NOTE: core does NOT enable `reportImplicitStringConcatenation`, and this repo
# deliberately matches core rather than livespec-runtime, which does. Enabling it
# turns 15 pre-existing, deliberate multi-line message strings in this code into
# errors — a rule the code was never written against. Raising the bar is a
# separate decision from relocating the code; do it on purpose or not at all.
#

# ---------------------------------------------------------------------------
# Pytest.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["overseer", "tests"]
addopts = "-q"
markers = [
    "integration: integration-tier scenario coverage",
]

# ---------------------------------------------------------------------------
# Coverage — 100% statements AND branches.
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
# RELOCATED ROW 5/7. Coverage measures the code under test, not the test code,
# mirroring the pyright exclude above.
omit = [
    # The e2e-cli tests set COVERAGE_PROCESS_START to measure real shipped
    # entrypoints. Host-installed tooling they shell out to can inherit that
    # setting too; it is not this repo's code and must not be measured.
    "/usr/local/*",
    "*/.venv/*",
    "*/site-packages/*",
    "*/_vendor/*",
    "*/__pycache__/*",
    "/tmp/*",
    "overseer/test_*.py",
    "overseer/conftest.py",
    "tests/test_*.py",
    "tests/conftest.py",
    "tests/integration/test_*.py",
    "tests/integration/conftest.py",
    "tests/prompts/test_*.py",
    "tests/prompts/conftest.py",
    # The live Codex TUI picker acceptance (overseer-kju6wh) is opt-in via
    # `LIVESPEC_CODEX_SKILL_PICKER=1`, so under an ordinary suite run pytest
    # IMPORTS it (module lines execute) but skips every test body — leaving the
    # bodies permanently uncovered against a 100% floor. Omitting the tier is the
    # same treatment livespec-orchestrator-beads-fabro gives its `tests/e2e-cli/*`.
    # This omits TEST code, never product code: coverage of `overseer/` is
    # untouched, and the tier's own gate is `just check-codex-skill-picker`.
    "tests/e2e-cli/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
# `exclude_also` — NOT `exclude_lines`. This distinction is load-bearing and cost
# a debugging round: `exclude_lines` REPLACES coverage.py's built-in default
# exclusions, while `exclude_also` ADDS to them. Using `exclude_lines` here
# dropped the defaults and made `tmuxio.py` report 144 statements / 70 branches
# instead of core's 126 / 34 — the delta being the 18 `Protocol` method stubs
# whose bodies are a bare `...`, which the defaults elide. The file is
# byte-identical to core's; only the config differed.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise ImportError",
    "@overload",
    "if __name__ == .__main__.:",
    "sys.path.insert",
    "case _:",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["overseer*"]

# `version.json` carries the release version literal that `version.py` reads at
# import. Without this it is omitted from the built wheel and the INSTALLED
# console scripts raise FileNotFoundError on import while the editable install
# and the in-tree executables keep working — a failure that appears only in a
# real wheel, never in this repo's own test run. Pinned by
# `overseer/test_package_constraints.py::test_release_please_never_targets_a_
# python_file_and_the_version_data_ships`, which asserts this DECLARATION.
# It deliberately does not build a wheel: that needs a subprocess, which
# `check-tests-no-subprocess-spawn` forbids, so a wheel that omitted the file
# despite a correct declaration would not be caught.
[tool.setuptools.package-data]
overseer = ["version.json"]
